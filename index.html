
<!DOCTYPE html>
<html lang="zh-HK">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>文言地城：始得西山宴遊記</title>
    
    <!-- PWA & Mobile Optimization -->
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="文言地城">
    <meta name="mobile-web-app-capable" content="yes">
    
    <!-- Apple Touch Icon (iOS 桌面圖標) -->
    <link rel="apple-touch-icon" href="/app_icon.png">
    
    <!-- 使用 Web App Manifest 以覆蓋 Chrome 的預設行為 -->
    <link rel="manifest" href="metadata.json">
    
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=LXGW+WenKai+Mono+TC&display=block');

        :root {
            --app-bg: #f4f1ea;
            --panel-bg: rgba(235, 230, 220, 0.85);
            --panel-border: rgba(184, 134, 11, 0.25);
            --text-main: #2c2c2c;
            --text-sub: #555;
            --gold-accent: #b8860b;
            --hud-bg: rgba(255, 255, 255, 0.25);
            --hud-border: rgba(184, 134, 11, 0.1);
            --divider-color: #b8860b;
            --input-btn-bg: #ffffff;
            --input-btn-text: #2c2c2c;
            --input-btn-border: #d1d1d1;
            --slot-bg: rgba(0, 0, 0, 0.05);
            --reflection-tint: rgba(0, 0, 0, 0.08);
            --header-bg: rgba(255, 255, 255, 0.3);
            --theme-transition: 0.5s cubic-bezier(0.4, 0, 0.2, 1);
            --sab: env(safe-area-inset-bottom);
            --sat: env(safe-area-inset-top);
        }

        .dark-mode {
            --app-bg: #0f0f0f; 
            --panel-bg: rgba(24, 24, 24, 0.9);
            --panel-border: rgba(184, 134, 11, 0.2);
            --text-main: #e0e0e0;
            --text-sub: #999999;
            --gold-accent: #b8860b;
            --hud-bg: rgba(15, 15, 15, 0.85);
            --hud-border: rgba(184, 134, 11, 0.15);
            --divider-color: #b8860b;
            --input-btn-bg: #1e1e1e;
            --input-btn-text: #e0e0e0;
            --input-btn-border: #333333;
            --slot-bg: rgba(255, 255, 255, 0.03);
            --reflection-tint: rgba(255, 255, 255, 0.05);
            --header-bg: rgba(0, 0, 0, 0.4);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            user-select: none;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            font-family: 'LXGW WenKai Mono TC', monospace;
            background-color: #000;
            height: 100dvh;
            width: 100vw;
            overflow: hidden;
            display: flex;
            justify-content: center;
            align-items: center;
            color: var(--text-main);
            transition: color var(--theme-transition);
        }

        #root {
            position: relative;
            height: 90dvh;
            width: calc(90dvh * 0.5625);
            max-width: 100vw;
            background-color: transparent; 
            border-radius: 30px;
            -webkit-mask-image: -webkit-radial-gradient(white, black);
            mask-image: radial-gradient(white, black);
            mask-clip: border-box;
            overflow: hidden; 
            box-shadow: 0 0 50px rgba(0,0,0,0.8);
            contain: layout paint;
            isolation: isolate;
            transition: background-color var(--theme-transition);
            transform: translateZ(0);
        }

        #root > div:first-child {
            background-color: var(--app-bg);
            width: 100%;
            height: 100%;
            transition: background-color var(--theme-transition);
            display: flex;
            flex-direction: column;
        }

        @media (max-width: 600px) {
            #root { 
                width: 100vw; 
                height: 100dvh;
                border-radius: 0; 
                -webkit-mask-image: none;
                mask-image: none;
            }
        }

        @keyframes tabSlideIn {
            from { transform: translateX(30px); opacity: 0; }
            to { transform: translateX(0); opacity: 1; }
        }
        .tab-slide-active { animation: tabSlideIn 0.4s cubic-bezier(0.16, 1, 0.3, 1) forwards; }

        @keyframes fadeIn {
            from { opacity: 0; backdrop-filter: blur(0px); -webkit-backdrop-filter: blur(0px); }
            to { opacity: 1; backdrop-filter: blur(24px); -webkit-backdrop-filter: blur(24px); }
        }
        
        @keyframes simpleFadeIn { from { opacity: 0; } to { opacity: 1; } }
        @keyframes simpleFadeOut { from { opacity: 1; } to { opacity: 0; } }
        @keyframes fadeOut {
            from { opacity: 1; backdrop-filter: blur(24px); -webkit-backdrop-filter: blur(24px); }
            to { opacity: 0; backdrop-filter: blur(0px); -webkit-backdrop-filter: blur(0px); }
        }

        .animate-fadeIn { animation: fadeIn 0.5s ease-out forwards; }
        .animate-simpleFadeIn { animation: simpleFadeIn 0.3s ease-out forwards; }
        .animate-simpleFadeOut { animation: simpleFadeOut 0.3s ease-in forwards; }
        .animate-fadeOut { animation: fadeOut 0.4s ease-in forwards; }

        .input-pad-btn {
            border-radius: 12px;
            overflow: hidden;
            isolation: isolate;
            will-change: transform, opacity;
            transform: translate3d(0, 0, 0);
            backface-visibility: hidden;
            -webkit-backface-visibility: hidden;
            box-shadow: 0 5px 0 rgba(0,0,0,0.3), inset 0 1px 1px var(--reflection-tint);
            transition: transform 0.1s cubic-bezier(0.2, 0, 0.2, 1), 
                        box-shadow 0.1s cubic-bezier(0.2, 0, 0.2, 1), 
                        filter 0.1s ease,
                        background-color var(--theme-transition),
                        color var(--theme-transition);
            width: 100% !important;
            height: 100% !important;
            max-height: 96px; 
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .input-pad-btn:active {
            transform: translate3d(0, 5px, 0) scale(0.92) !important;
            box-shadow: 0 0px 0 #000, inset 0 4px 8px rgba(0,0,0,0.4) !important;
            filter: brightness(0.8) !important;
        }

        @keyframes cardPopIn {
            0% { opacity: 0; transform: translate3d(0, -60px, 0) scale(1.05); filter: brightness(2) blur(2px); }
            100% { opacity: 1; transform: translate3d(0, 0, 0) scale(1); filter: brightness(1) blur(0); }
        }
        @keyframes cardExitDown {
            0% { opacity: 1; transform: translate3d(0, 0, 0); filter: brightness(1); }
            100% { opacity: 0; transform: translate3d(0, 40px, 0); filter: brightness(0.2); }
        }
        @keyframes stamp-in {
            0% { transform: scale(1.75); opacity: 0; filter: brightness(1.5) blur(1px); }
            10% { opacity: 1; }
            100% { transform: scale(1); opacity: 1; filter: brightness(1) blur(0); }
        }
        @keyframes char-converge {
            0% { transform: translate3d(0, 0, 0) scale(1); opacity: 1; filter: brightness(1) blur(0); }
            15% { transform: translate3d(0, -32px, 0) scale(1.15); filter: brightness(1.8) blur(0.5px); opacity: 1; }
            40% { transform: translate3d(calc(var(--tx) * 0.2), calc(-32px + (var(--ty) + 32px) * 0.2), 0) scale(0.5); opacity: 0.9; filter: brightness(2.5) blur(1px); }
            100% { transform: translate3d(var(--tx), var(--ty), 0) scale(0.1); opacity: 0; filter: brightness(10) blur(4px); }
        }
        .char-converge-active { animation: char-converge 0.5s cubic-bezier(0.4, 0, 0.2, 1) forwards; }
        .stamp-active { animation: stamp-in 0.2s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards; }
        .card-enter-active { animation: cardPopIn 0.5s cubic-bezier(0.175, 0.885, 0.32, 1.1) both; }
        .card-exit-active { animation: cardExitDown 0.4s cubic-bezier(0.33, 0, 0.67, 0) both; }

        .global-scene-bg {
            filter: brightness(1) contrast(1.1);
            transition: opacity 0.7s ease-out, filter var(--bg-dim-duration, 0.4s) cubic-bezier(0.4, 0, 0.2, 1);
            will-change: opacity, filter;
        }
        .bg-attack-dim { filter: brightness(0.2) contrast(1.1) !important; }

        .gold-divider {
            position: absolute;
            height: 2px;
            background: var(--gold-accent);
            width: 100%;
            left: 0;
            transform-origin: center;
            transform: scaleX(0) translateZ(0);
            z-index: 30;
            box-shadow: 0 0 10px rgba(184, 134, 11, 0.3);
            transition: transform 1.4s cubic-bezier(0.22, 1, 0.36, 1), background-color var(--theme-transition);
        }
        .gold-divider.active { transform: scaleX(1) translateZ(0); }

        .hp-text {
            position: absolute;
            inset: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            color: rgba(255, 255, 255, 0.9);
            font-size: 10px;
            font-weight: bold;
            text-shadow: 0 1px 2px black;
            z-index: 50;
        }

        .hp-bar-gpu-layer {
            transform-origin: left center;
            will-change: transform;
            transform: scaleX(0) translateZ(0);
        }

        .hp-fill-hit { transition: transform 0.4s cubic-bezier(0.2, 0, 0, 1); }
        .hp-buffer-hit { transition: transform 0.8s cubic-bezier(0.2, 0, 0, 1); }
        .hp-fill-slow { transition: transform 1.2s cubic-bezier(0.4, 0, 0.2, 1); }
        .hp-buffer-slow { transition: transform 1.5s cubic-bezier(0.4, 0, 0.2, 1); }

        @keyframes fall-left {
            0% { transform: translate3d(0,0,0) rotate(0); filter: brightness(1); }
            15% { filter: brightness(1.5); }
            100% { transform: translate3d(-120px, 450px, 0) rotate(-180deg) scale(0.6); opacity: 0; filter: brightness(0.2); }
        }
        @keyframes fall-right {
            0% { transform: translate3d(0,0,0) rotate(0); filter: brightness(1); }
            15% { filter: brightness(1.5); }
            100% { transform: translate3d(120px, 450px, 0) rotate(180deg) scale(0.6); opacity: 0; filter: brightness(0.2); }
        }

        .base-offset { transform: translate3d(50px, 8px, 0); }
        @keyframes fatigue-loop {
            0%, 100% { transform: translate3d(50px, 8px, 0) rotate(0deg); }
            50% { transform: translate3d(50px, 18px, 0) rotate(2.5deg); }
        }
        .boss-fatigue-anim { animation: fatigue-loop 5s ease-in-out infinite; }
        @keyframes fatigue-shake-hurt {
            0%, 100% { transform: translate3d(0, 0, 0) rotate(0); filter: brightness(1); }
            15% { transform: translate3d(-15px, -2px, 0) rotate(-4deg); filter: brightness(2); }
            35% { transform: translate3d(20px, 2px, 0) rotate(6deg); }
        }
        .fatigue-hurt-anim { animation: fatigue-shake-hurt 0.7s cubic-bezier(0.22, 0.61, 0.36, 1) both; }

        @keyframes damage-number-pop {
            0% { transform: scale(1.5) translateY(0); filter: brightness(1); }
            30% { transform: scale(1.75) translateY(2px); filter: brightness(2.5); }
            100% { transform: scale(1.5) translateY(0); filter: brightness(1); }
        }
        .damage-pop-active { animation: damage-number-pop 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275); }

        .input-pad-grid {
            display: grid;
            grid-template-columns: repeat(5, 1fr);
            grid-template-rows: repeat(4, 1fr);
            gap: 10px 8px;
            padding: 12px;
            width: 100%;
            height: 100%;
        }

        @keyframes global-shake {
            0%, 100% { transform: translate3d(0, 0, 0); }
            10%, 50%, 90% { transform: translate3d(-6px, 6px, 0); }
            30%, 70% { transform: translate3d(6px, -6px, 0); }
        }
        .shake-active { animation: global-shake 0.3s cubic-bezier(.36,.07,.19,.97) both; }

        .pause-overlay {
            position: absolute;
            inset: 0;
            z-index: 99999;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            background: rgba(10, 10, 10, 0.75);
            backdrop-filter: blur(24px);
            -webkit-backdrop-filter: blur(24px);
        }
        .pause-overlay.hidden-pause { opacity: 0; visibility: hidden; pointer-events: none; }
        .pause-overlay.show-pause { animation: fadeIn 0.5s forwards; }
        
        .modern-glass-btn { 
            background: rgba(255, 255, 255, 0.08); 
            border: 1px solid rgba(255, 255, 255, 0.1); 
            backdrop-filter: blur(8px); 
            -webkit-backdrop-filter: blur(8px); 
            color: #ddd; 
            padding: 1rem 4rem; 
            border-radius: 9999px; 
            font-weight: 700; 
            font-size: 1.25rem; 
            letter-spacing: 12px; 
            transition: all 0.3s; 
            box-shadow: 0 4px 20px rgba(0,0,0,0.3), inset 0 1px 1px var(--reflection-tint); 
            display: flex; 
            align-items: center; 
            justify-content: center; 
            text-indent: 12px; 
            width: 280px; 
        }

        @keyframes speech-in-out {
            0% { opacity: 0; transform: translateY(20px) scale(0.96); filter: blur(10px) brightness(1.5); }
            16.6% { opacity: 1; transform: translateY(0) scale(1); filter: blur(0) brightness(1); }
            83.3% { opacity: 1; transform: translateY(0) scale(1); filter: blur(0) brightness(1); }
            100% { opacity: 0; transform: translateY(45px) scale(0.92); filter: blur(15px) brightness(1.2); }
        }
        .speech-anim { animation-name: speech-in-out; animation-timing-function: cubic-bezier(0.16, 1, 0.3, 1); animation-fill-mode: forwards; }

        @keyframes speech-fatal-in {
            0% { opacity: 0; transform: translateY(20px) scale(0.96); filter: blur(10px) brightness(1.5); }
            100% { opacity: 1; transform: translateY(0) scale(1); filter: blur(0) brightness(1); }
        }
        .speech-fatal-anim { animation: speech-fatal-in 0.6s cubic-bezier(0.16, 1, 0.3, 1) forwards; }

        @keyframes slash-anim-universal { 
            0% { opacity: 0; transform: translate(-50%, -50%) rotate(var(--rot)) scaleX(0) scaleY(1); filter: brightness(1.5); } 
            20% { opacity: 1; transform: translate(-50%, -50%) rotate(var(--rot)) scaleX(1.2) scaleY(1.5); filter: brightness(1.5); } 
            100% { opacity: 0; transform: translate(-50%, -50%) rotate(var(--rot)) scaleX(1.8) scaleY(0.2); filter: brightness(1); } 
        }
        .slash-line-base { position: absolute; width: 140%; height: 8px; background: #fff; opacity: 0; pointer-events: none; z-index: 9000; transform-origin: center; }
        .boss-slash-line { box-shadow: 0 0 7px #fff, 0 0 16px #ff0000, 0 0 30px #ff0000; animation: slash-anim-universal 0.5s cubic-bezier(0.15, 0.85, 0.35, 1) forwards; }
        .player-slash-line { box-shadow: 0 0 10px #fff, 0 0 20px #00f2ff, 0 0 45px #0066ff; animation: slash-anim-universal 0.5s cubic-bezier(0.15, 0.85, 0.35, 1) forwards; z-index: 10000; }

        @keyframes icon-glow-pulse {
            0%, 100% { opacity: 1; box-shadow: 0 0 5px rgba(184, 134, 11, 0.1); }
            50% { opacity: 0.6; box-shadow: 0 0 15px rgba(184, 134, 11, 0.3); }
        }
        .animate-icon-glow { animation: icon-glow-pulse 3s infinite ease-in-out; }

        .marquee-wrapper {
            position: relative;
            overflow: hidden;
            width: 100%;
            mask-image: linear-gradient(to right, transparent, black 25px, black calc(100% - 25px), transparent);
            -webkit-mask-image: linear-gradient(to right, transparent, black 25px, black calc(100% - 25px), transparent);
        }
        .marquee-content { display: inline-block; white-space: nowrap; will-change: transform; padding: 0 25px; }
        @keyframes floatAnim {
            0%, 100% { transform: translateY(0) rotate(0); }
            50% { transform: translateY(-10px) rotate(1deg); }
        }
        .float-active { animation: floatAnim 4s ease-in-out infinite; }
    </style>
<script type="importmap">

</script>
</head>

    <div id="root"></div>
